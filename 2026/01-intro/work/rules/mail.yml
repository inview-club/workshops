groups:
  - name: vm_alerts
    rules:
      - alert: HostHighCPULoad
        expr: 1 - (avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > .80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Host high CPU load (instance {{ $labels.instance }})
          description: "CPU load is > 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      
      - alert: HostLoadAverageWarning
        expr: node_load1 > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Load Average (1m) on {{ $labels.instance }}"
          description: "1-minute load average is > 0. Current value is {{ $value }}"